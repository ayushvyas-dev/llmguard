version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: llmguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmguard
      POSTGRES_PASSWORD: llmguard_password
      POSTGRES_DB: llmguard
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U llmguard -d llmguard']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llmguard-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmguard-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: '5000'
      DATABASE_URL: 'postgresql://llmguard:llmguard_password@postgres:5432/llmguard?schema=public'
      DIRECT_URL: 'postgresql://llmguard:llmguard_password@postgres:5432/llmguard?schema=public'
      UPSTASH_REDIS_URL: 'redis://redis:6379'
      API_KEY_PEPPER: 'llmguard-production-pepper'
      LOG_LEVEL: 'info'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
