name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: llmguard, POSTGRES_USER: llmguard, POSTGRES_PASSWORD: llmguard}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U llmguard -d llmguard" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: {run: {working-directory: backend}}
    env:
      DATABASE_URL: postgresql+psycopg://llmguard:llmguard@localhost:5432/llmguard
      DATABASE_URL_DIRECT: postgresql+psycopg://llmguard:llmguard@localhost:5432/llmguard
      REDIS_URL: redis://localhost:6379/0
      API_KEY_PEPPER: ci_test_api_key_pepper_must_be_at_least_32_characters_long!
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pip-audit
      - run: uv run pytest tests/unit tests/integration tests/contract -q
      - run: uv run python -m tests.security_eval.run --dataset all
      - run: uv run alembic upgrade head && uv run alembic check
      - name: Verify Backend Docker Build
        run: docker build -t llmguard-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
